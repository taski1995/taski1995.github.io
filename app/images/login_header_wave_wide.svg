<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 1920 385"
	preserveAspectRatio="none"
>
	<defs>
		<linearGradient
			id="backgroundGradient"
			x1="0%"
			y1="0%"
			x2="100%"
			y2="100%"
		>
			<stop offset="0%" stop-color="#3B82F6"/>
			<stop offset="100%" stop-color="#2563EB"/>
		</linearGradient>
		<radialGradient
			id="leftBlob"
			cx="50%"
			cy="50%"
			r="70%"
		>
			<stop
				offset="0%"
				stop-color="#93C5FD"
				stop-opacity="0.55"
			/>
			<stop
				offset="100%"
				stop-color="#93C5FD"
				stop-opacity="0"
			/>
		</radialGradient>
		<radialGradient
			id="rightBlob"
			cx="50%"
			cy="50%"
			r="70%"
		>
			<stop
				offset="0%"
				stop-color="#60A5FA"
				stop-opacity="0.40"
			/>
			<stop
				offset="100%"
				stop-color="#60A5FA"
				stop-opacity="0"
			/>
		</radialGradient>
		<linearGradient
			id="highlight"
			x1="0%"
			y1="0%"
			x2="100%"
			y2="0%"
		>
			<stop
				offset="0%"
				stop-color="#FFFFFF"
				stop-opacity="0"
			/>
			<stop
				offset="50%"
				stop-color="#FFFFFF"
				stop-opacity="0.10"
			/>
			<stop
				offset="100%"
				stop-color="#FFFFFF"
				stop-opacity="0"
			/>
		</linearGradient>
		<clipPath id="headerClip">
			<path
				d=
				"
					M0,0
					L1920,0
					L1920,295

					C1650,220
					1400,330
					1100,370

					C700,430
					350,290
					0,350

					Z
				"
			/>
		</clipPath>
	</defs>
	<g clip-path="url(#headerClip)">
		<rect
			width="1920"
			height="450"
			fill="url(#backgroundGradient)"
		/>
		<ellipse
			cx="250"
			cy="120"
			rx="450"
			ry="300"
			fill="url(#leftBlob)"
		/>
		<ellipse
			cx="1700"
			cy="220"
			rx="400"
			ry="280"
			fill="url(#rightBlob)"
		/>
		<ellipse
			cx="960"
			cy="30"
			rx="900"
			ry="120"
			fill="url(#highlight)"
		/>
		<path
			d=
			"
				M200 190
				C700 110,
				1200 260,
				1750 150
			"
			fill="none"
			stroke="rgba(255,255,255,0.14)"
			stroke-width="2"
		/>
	</g>
</svg>
